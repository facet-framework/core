# Every check a change to FACET Core has to pass. A release branch
# (release/<version>) is merged into main only when the final job, ci-green,
# has succeeded on its commit, and the release workflow refuses a commit
# without a successful run of this workflow.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -buildvcs=false
  # The Go the release binaries are built with (release.yml pins the same).
  # Every job uses it except the go job's go.mod leg, which tests the oldest
  # Go that go.mod admits, and the format job. THIRD_PARTY.json is collected
  # with this version.
  FACET_GO_VERSION: "1.27.4"
  # The scripts refuse this layout unless the export receipt names Core.
  FACET_RELEASE_LAYOUT: public

jobs:
  receipt:
    name: receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version from the receipt
        id: version
        run: echo "version=$(sh scripts/release-receipt.sh version)" >> "$GITHUB_OUTPUT"
      - name: Every tracked file matches the receipt
        if: github.event_name != 'pull_request'
        run: sh scripts/release-receipt.sh verify
      - name: Files this pull request changes against the receipt
        if: github.event_name == 'pull_request'
        run: |
          sh scripts/release-receipt.sh diff > "$RUNNER_TEMP/receipt.diff"
          if [ -s "$RUNNER_TEMP/receipt.diff" ]; then
            echo "::notice::This change differs from the exported source in $(wc -l < "$RUNNER_TEMP/receipt.diff") place(s); it is carried into the next export by the maintainers."
            cat "$RUNNER_TEMP/receipt.diff"
          fi
      - name: The changelog holds release notes for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/release-changelog.sh notes "$VERSION"

  go:
    name: go (${{ matrix.os }}, ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: [go.mod, pinned]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go == 'pinned' && env.FACET_GO_VERSION || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          cache: false
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      # The test suite runs on Linux only in this release; macOS and Windows
      # build and vet here and start the packaged binary in the native job.
      - if: runner.os == 'Linux'
        run: go test ./...

  race:
    name: race
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - run: go test -race ./...

  format:
    name: format and modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt lists no file
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go mod tidy leaves go.mod and go.sum unchanged
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: Build every package for the six release platforms
        run: |
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$platform"
            GOOS=${platform%/*} GOARCH=${platform#*/} go build ./...
            echo "::endgroup::"
          done

  facet-lint:
    name: facet lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: The repository carries its own registry
        run: |
          for path in .facetrc.yaml docs/facets; do
            [ -e "$path" ] || { echo "::error::$path is missing; this repository lints its own registry"; exit 1; }
          done
      - name: Install yq and ajv
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/mikefarah/yq/v4@v4.53.6
          npm install --global --prefix "$RUNNER_TEMP/npm" ajv-cli@5.0.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Shell lint suite with every dependency required
        run: |
          FACET_STRICT_DEPS=1 sh tools/facet-lint/run-all.sh | tee "$RUNNER_TEMP/lint.log"
          want=$(find docs/facets -name '*.yaml' | wc -l)
          got=$(grep -c 'Checking:' "$RUNNER_TEMP/lint.log" || true)
          echo "validated $got of $want records"
          [ "$want" -gt 0 ] && [ "$got" -eq "$want" ]
      - name: The built command lints the registry
        run: |
          go build -o "$RUNNER_TEMP/facet" ./cmd/facet
          "$RUNNER_TEMP/facet" lint

  shell:
    name: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: shellcheck
        # SC1007: `CDPATH= cd` deliberately empties CDPATH for that one command.
        run: |
          shellcheck --version
          { find . -path ./.git -prune -o -type f -name '*.sh' -print; echo bin/facet; echo bin/facet-lint; } |
            sort | xargs shellcheck --severity=warning --exclude=SC1007
      - name: Install yq and ajv
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/mikefarah/yq/v4@v4.53.6
          npm install --global --prefix "$RUNNER_TEMP/npm" ajv-cli@5.0.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Every shell test suite
        run: |
          suites=$(find . -path ./.git -prune -o -type f -name '*.test.sh' -print | sort)
          [ -n "$suites" ] || { echo "::error::no *.test.sh suite found"; exit 1; }
          failed=0
          for suite in $suites; do
            echo "::group::$suite"
            sh "$suite" || { echo "::error::$suite failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

  examples:
    name: examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: Lint every example project with the built command
        run: |
          go build -o "$RUNNER_TEMP/facet" ./cmd/facet
          projects=$(find examples -name .facetrc.yaml -exec dirname {} \; | sort)
          [ -n "$projects" ] || { echo "::error::no example project with a .facetrc.yaml"; exit 1; }
          for project in $projects; do
            echo "::group::$project"
            "$RUNNER_TEMP/facet" --root "$project" lint
            echo "::endgroup::"
          done

  package:
    name: package dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: receipt
    outputs:
      distribution: ${{ steps.package.outputs.distribution }}
    env:
      FACET_RELEASE_REPO: ${{ github.repository }}
      VERSION: ${{ needs.receipt.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: Package the six platforms
        id: package
        run: |
          sh scripts/release-package-core.sh "$VERSION" "$RUNNER_TEMP/dist"
          echo "distribution=$(sh scripts/release-stamp.sh distribution "$FACET_RELEASE_REPO")" >> "$GITHUB_OUTPUT"
      - name: Every archive has the name bin/facet asks for
        run: |
          sed -n '/^archive_shape() {/,/^}/p' bin/facet > "$RUNNER_TEMP/shape.sh"
          . "$RUNNER_TEMP/shape.sh"
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            archive_shape "$platform"
            name="facet_${VERSION}_${platform}.${ARCHIVE_EXT}"
            [ "$(sh scripts/release-package-core.sh --archive-name "$platform" "$VERSION")" = "$name" ]
            [ -f "$RUNNER_TEMP/dist/$name" ]
            grep -q "  $name\$" "$RUNNER_TEMP/dist/checksums.txt"
          done
          (cd "$RUNNER_TEMP/dist" && sha256sum --check --strict checksums.txt)
          jq -e '.platforms | length == 6' "$RUNNER_TEMP/dist/release-manifest.json"
      - name: Packaging again gives the same bytes
        run: |
          sh scripts/release-package-core.sh "$VERSION" "$RUNNER_TEMP/dist-again"
          diff -r "$RUNNER_TEMP/dist" "$RUNNER_TEMP/dist-again"
      - name: npm packages pack from the archives (nothing is published)
        run: |
          cp -R "$RUNNER_TEMP/dist" "$RUNNER_TEMP/npm-dist"
          sh scripts/release-npm-pack.sh "$RUNNER_TEMP/npm-dist"
          jq '{publishable, blocked_by, dist_tag, packages: [.packages[].name]}' "$RUNNER_TEMP/npm-dist/npm/publish-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  native:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [receipt, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, platform: linux_arm64 }
          - { os: macos-15-intel, platform: darwin_amd64 }
          - { os: macos-15, platform: darwin_arm64 }
          - { os: windows-2025, platform: windows_amd64 }
          - { os: windows-11-arm, platform: windows_arm64 }
    env:
      VERSION: ${{ needs.receipt.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      DISTRIBUTION: ${{ needs.package.outputs.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-dist
          path: ${{ runner.temp }}/dist
      - name: bin/facet installs this platform's archive and runs it offline
        if: runner.os != 'Windows'
        run: sh scripts/release-dispatcher-check.sh "$RUNNER_TEMP/dist" "$GITHUB_REPOSITORY"
      - name: The Windows binary states its provenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $out = Join-Path $env:RUNNER_TEMP 'x'
          Expand-Archive -Path (Join-Path $dist "facet_$($env:VERSION)_$($env:PLATFORM).zip") -DestinationPath $out
          $answer = & (Join-Path $out 'facet.exe') version --json
          if ($LASTEXITCODE -ne 0) { throw "facet.exe version --json failed" }
          $answer
          $got = $answer | ConvertFrom-Json
          $want = Get-Content -Raw (Join-Path $dist 'release-manifest.json') | ConvertFrom-Json
          $checks = [ordered]@{
            product = $got.product -eq 'core'
            version = $got.version -eq $want.full_version
            distribution = $got.distribution -eq $env:DISTRIBUTION
            channel = $got.channel -eq $want.channel
            source_commit = $got.source_commit -eq $want.source_commit
            build_time = "$($got.build_time)" -eq "$($want.build_time)"
            dirty = $got.dirty -eq $false
          }
          $checks
          if ($checks.Values -contains $false) { throw "facet.exe does not state the provenance of release-manifest.json" }

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:go
          # A pull request from a fork gets a read-only token; it is analysed, not uploaded.
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  licenses:
    name: license and notices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: LICENSE is the Apache License 2.0, NOTICE and THIRD_PARTY.md are present
        run: |
          head -n 5 LICENSE | grep -qx '[[:space:]]*Apache License[[:space:]]*'
          head -n 5 LICENSE | grep -qx '[[:space:]]*Version 2\.0, January 2004[[:space:]]*'
          for f in NOTICE THIRD_PARTY.md; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          if grep -q '{{' LICENSE NOTICE THIRD_PARTY.md; then
            echo "::error::a license file still holds a template placeholder"
            exit 1
          fi
      # A NOTICE that points at third-party notices nobody ships is a failure,
      # here and again in the release plan.
      - name: Every notice NOTICE refers to is in the tree
        run: sh scripts/release-notice-check.sh
      # The pinned Go the release workflow builds with, so an inventory not
      # collected with that version fails here before it fails a release.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: THIRD_PARTY.json lists every module compiled on the six platforms and this Go toolchain
        env:
          CGO_ENABLED: "0"
        run: |
          go version
          sh scripts/release-third-party-check.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.FACET_GO_VERSION }}
          cache: false
      - name: gitleaks over the whole history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --exit-code 1 .

  ci-green:
    name: ci-green
    if: always()
    needs:
      - receipt
      - go
      - race
      - format
      - cross-compile
      - facet-lint
      - shell
      - examples
      - package
      - native
      - govulncheck
      - codeql
      - dependency-review
      - licenses
      - actionlint
      - secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # dependency review runs on pull requests only; skipped is its result everywhere else.
          printf '%s' "$NEEDS" | jq -e 'to_entries
            | map(select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped")))
            | length == 0' > /dev/null
