# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/layout/granularity-calibration
lifecycle: active
intent:
  summary: |
    Reports how finely a registry is documented using measured distributions and
    a diagnosis against FACET §11.4, because granularity belongs to the whole
    registry and is invisible from inside a single entry. Mixed distributions
    name the thin tail beside the grouping that works and count repeated
    capability and feature names rather than guessing their frequency. The
    sizing lint warns about individual scenario counts outside its band without
    sizing valid planned stubs.
contract:
  scenarios:
    - id: a-single-scenario-record-is-a-warning
      statement: |
        Given an active record declaring exactly one contract scenario
        When 'facet lint' runs
        Then a warning cites gate 3 of the sizing test, because a feature with
        one observable behaviour and no failure path is usually a scenario of
        the record above it
      post_state:
        severity: warning
    - id: a-far-oversized-record-is-a-warning
      statement: |
        Given an active record declaring more than twelve contract scenarios
        When 'facet lint' runs
        Then a warning is reported, the linter's ceiling sitting above the
        guidance's nine on purpose: the gate is what an author aims at and this
        is the backstop
      post_state:
        severity: warning
    - id: a-planned-record-is-never-sized
      statement: |
        Given a record at lifecycle 'planned'
        When 'facet lint' runs
        Then no sizing finding is produced, because a stub is explicitly valid
        and a check contradicting that would be the framework arguing with
        itself
    - id: the-zero-case-belongs-to-another-check
      statement: |
        Given an anchored record declaring no scenarios at all
        When 'facet lint' runs
        Then only the no-scenarios check reports it, because two findings for
        one cause read as two defects
    - id: calibration-names-the-level-not-the-number
      statement: |
        Given a registry whose median record declares one scenario
        When 'facet calibrate' runs
        Then it reports that records are being written at scenario granularity,
        rather than only reporting the median
    - id: calibration-reports-medians
      statement: |
        Given a registry holding one forty-scenario record among two thousand
        single-scenario records
        When 'facet calibrate' runs
        Then the reported figure is the median, because the mean is what
        conceals exactly this shape
    - id: calibration-never-fails-a-run
      statement: |
        Given a registry far outside every band
        When 'facet calibrate' runs
        Then the exit code is zero, because a check that could fail would be
        answered by tuning the number rather than the records
      post_state:
        exit_code: 0
    - id: a-registry-that-disagrees-with-itself-is-read-as-two
      statement: |
        Given a registry where most capabilities hold a single record while
        others in the same registry hold dozens
        When 'facet calibrate' runs
        Then the reading names the largest capability beside the count of thin
        ones, so a tail standing next to a grouping that works is not reported
        as a house style — and where no such contrast exists none is claimed
    - id: calibration-works-without-a-taxonomy
      statement: |
        Given a project that declares no taxonomy
        When 'facet calibrate' runs
        Then it groups by the id segments as they are, because the registries
        most in need of the answer are the ones that never declared one
    - id: the-thin-tail-is-counted-not-guessed
      statement: |
        Given thin capabilities whose segment repeats their feature name, when
        the registry is calibrated, then the reading names how many do and
        asserts no proportion it has not counted.
    - id: knowledge-slots-are-counted-three-ways
      statement: |
        Given records whose Knowledge slots are answered, open, or declared not
        applicable, when the registry is calibrated, then all three counts are
        reported side by side rather than as one quota.
    - id: an-empty-declared-node-counts-as-zero
      statement: |
        Given a taxonomy declaring a capability with no records under it
        When 'facet calibrate' runs
        Then that capability is counted as zero rather than omitted, because
        dropping it would report a registry as healthier the more of it was
        missing
verification:
  unit_tests:
    - id: registry/calibrate_test.go
      proves:
        - the-thin-tail-is-counted-not-guessed
    - id: registry/knowledge_counts_test.go
      proves:
        - knowledge-slots-are-counted-three-ways
    - id: registry/calibrate_test.go
      proves:
        - calibration-names-the-level-not-the-number
        - calibration-reports-medians
        - calibration-works-without-a-taxonomy
        - an-empty-declared-node-counts-as-zero
        - a-registry-that-disagrees-with-itself-is-read-as-two
    - id: cli/calibrate_test.go
      proves:
        - calibration-never-fails-a-run
    - id: registry/taxonomy_test.go
      proves:
        - a-single-scenario-record-is-a-warning
        - a-far-oversized-record-is-a-warning
        - a-planned-record-is-never-sized
        - the-zero-case-belongs-to-another-check
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      The sizing test (FACET §2.1.1) — in particular that a record is meant to
      carry between two and nine scenarios, and that a count far outside that
      usually means the record sits one level away from where it was written.

      That scenario count, not record count, is the measure of how much a
      registry actually asserts.

      Every other check judges one record, which is why a registry of three
      thousand records with one scenario each and a registry of thirty with
      forty scenarios each both pass them clean — and they are the same product
      documented two levels apart. Granularity is a property of the whole list
      and invisible from inside any entry of it.

      'facet calibrate' measures four things against the bands in FACET §11.4
      and then says which level of the decomposition the registry has been
      written at. The sentence is the deliverable: a table of numbers is read
      once, a diagnosis gets pasted into a review.

      Where a registry disagrees with itself the reading says so. A tail of one-
      record capabilities can coexist with capabilities holding many records; a
      bare count invites rewriting the part that works. The report counts thin
      capabilities whose capability segment repeats the feature name, using the
      implemented name comparison rather than guessing a proportion; name
      similarity is evidence for review, not proof that two concepts are
      identical.

      The 'sizing' lint check covers the one gate of the sizing test a machine
      can evaluate — the scenario count — because that is the only one that
      catches a mis-sized record with no reviewer present.

      One line of the report comes from elsewhere: the unanchored hotspots
      (registry/integrity/unanchored-hotspots) are measured from the repository
      rather than the registry, and are carried here because a reader asking
      'what shape is this' is asking the same question.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not a quality gate. It reports and never fails; a project whose shape is
      genuinely unusual keeps its shape.

      Not a per-record verdict. A record may exceed the band with reason, and
      the warning is a question rather than a defect.

      Not a coverage measure. It says nothing about whether the records are
      true, only about how finely they were cut.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      'facet calibrate', with --json for CI and other tools. The per-record half
      arrives through 'facet lint' as the 'sizing' check, and on the save
      through the plugin's write hook.
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Reading a high record count as thoroughness. Two registries documenting
      one product at different granularities describe the same behaviour, so
      the assertion count should barely move between them; where it does, the
      difference is work that was never done.

      Fixing a sizing warning by adding scenarios that restate the same
      behaviour, rather than by asking whether the record is one level off.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      The reading line names a level rather than a number, and somebody can act
      on it without opening a single record.
