# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/layout/doubled-features
lifecycle: active
intent:
  summary: |
    Finds sibling ids shaped as 'x' and 'x-<word>' in one capability, a signal
    that one feature may have been documented twice. It asks for review rather
    than declaring a duplicate because only reading the summaries can establish
    whether they describe one feature. Lint names the pair and calibration
    reports the double count so recommendations do not rest on inflated medians.
contract:
  scenarios:
    - id: a-suffixed-record-beside-its-base-is-named
      statement: |
        Given 'x' and 'x-<word>' as two records of one capability
        When 'facet lint' runs
        Then a warning names both ids, so a reader knows which two summaries
        to compare
      post_state:
        severity: warning
    - id: a-suffix-without-a-partner-is-not-a-pair
      statement: |
        Given a hyphenated id whose base is not a record of the same
        capability
        When 'facet lint' runs
        Then nothing is reported, because a shared prefix on its own is an
        ordinary way to name neighbours and a check that called it a defect
        would be switched off
      post_state:
        findings: 0
    - id: a-pair-is-two-records-of-one-capability
      statement: |
        Given 'x-<word>' in one capability and 'x' in another
        When 'facet lint' runs
        Then they are not paired, because two records nobody could fold
        together are not a doubling
      post_state:
        findings: 0
    - id: the-calibration-says-when-it-counted-a-pair-twice
      statement: |
        Given a registry holding at least one such pair
        When 'facet calibrate' runs
        Then its reading states how many pairs there are and that the metrics
        below counted each of them as two records, so the medians are read
        for what they measured
verification:
  unit_tests:
    - id: registry/sibling_suffix_test.go
      proves:
        - a-suffixed-record-beside-its-base-is-named
        - a-suffix-without-a-partner-is-not-a-pair
        - a-pair-is-two-records-of-one-capability
        - the-calibration-says-when-it-counted-a-pair-twice
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      That a variant is FACET's answer for one feature on two paths: one
      record, one lifecycle per variant, declared in
      'docs/facets/variants.yaml'. Without that, the warning names a problem
      whose solution is not visible.

      The shape appears when a surface is rebuilt beside its predecessor and
      both records are kept. In an invented example, 'order-summary' with 9
      scenarios and 'order-summary-v2' with 16 describe the same panel: one
      feature documented twice.

      FACET already answers "one feature on two paths": a variant on one record,
      with a lifecycle per variant. Where 'variants.yaml' is not declared the
      variants are not available, and a second record is the only visible way —
      the mechanism exists, the knowledge of it does not.

      Two surfaces, because the finding matters to two readers. 'facet lint'
      names the pair to whoever maintains the records. 'facet calibrate' says
      that its own numbers counted the pair twice, because those medians are
      what a taxonomy recommendation rests on, and a recommendation built on
      doubled records cuts in the wrong place.

      It asks rather than states. The shape is a strong signal, never a proof:
      only a person can read two summaries and say whether they describe one
      surface. What this buys is that nobody has to spot the pattern by eye
      across a thousand ids.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not a duplicate detector. It reads ids, never summaries; two records
      describing the same feature under unrelated names are invisible to it.

      Not a verdict. A pair may be two real features that happen to share a
      prefix. The warning asks; it does not say what to do.

      Not a migration tool. Folding two records into one is a decision about
      what the product is, and the ids are immutable — see FACET §2.2.
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Renaming the suffixed record to silence the warning. An id is
      immutable; a rename is a migration and has to be named as one.

      Reading the count in 'facet calibrate' as a number of defects. It is a
      number of pairs to look at.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      'facet lint' reports it as the 'sibling-suffix' check; 'facet
      calibrate' carries the count and a reading.
    derive_from:
      - anchors
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      Either there are no pairs and nothing is said, or every pair is named
      with both of its ids.
lineage:
  owner:
    team: facet-framework
  created_at: "2026-09-21"
  superseded_by: null
