# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/layout/ticket-trackers
lifecycle: active
intent:
  summary: |
    Lets a project say where it keeps its issues, so a ticket a record names
    can be resolved to a tracker and a link — the way an agent gets from a
    specification to the why, why now and by whom that only the ticket holds.
contract:
  scenarios:
    - id: a-key-is-assigned-by-its-pattern
      statement: |
        Given trackers with a pattern each, Jira first and GitHub second
        When the key acme/shop#481 is resolved
        Then it belongs to the GitHub tracker
        And its link is built from that tracker's url with the pattern's named groups
    - id: a-named-tracker-wins-over-the-pattern
      statement: |
        Given a reference that names its tracker
        And a key that also matches another tracker's pattern
        When the key is resolved
        Then the named tracker is used
    - id: an-unmatched-key-falls-to-the-default-and-says-so
      statement: |
        Given a key no pattern matches and a tracker marked default
        When the key is resolved
        Then it belongs to the default tracker
        And the result says that it was resolved by default
    - id: without-trackers-no-link-is-invented
      statement: |
        Given a project that declares no trackers
        When a key is resolved
        Then no tracker and no link are returned
    - id: a-broken-pattern-is-a-config-error
      statement: |
        Given a tracker whose pattern does not compile
        When the configuration is loaded
        Then loading fails with an error naming the tracker
    - id: the-schema-accepts-trackers-and-refuses-a-bad-id
      statement: |
        Given a .facetrc.yaml with a trackers list
        When the project is linted against the shipped schema
        Then the list validates
        And a tracker id outside the slug grammar is a schema error
verification:
  unit_tests:
    - id: registry/trackers_test.go
      proves:
        - a-key-is-assigned-by-its-pattern
        - a-named-tracker-wins-over-the-pattern
        - an-unmatched-key-falls-to-the-default-and-says-so
        - without-trackers-no-link-is-invented
        - a-broken-pattern-is-a-config-error
        - the-schema-accepts-trackers-and-refuses-a-bad-id
knowledge:
  prerequisite_knowledge:
    question: "What must a user already know to use this?"
    answer: |
      The key format of each tracker the project uses, well enough to write a
      regular expression for it (RE2 syntax), and the URL an issue opens at.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not for reading issues: nothing here fetches one, and the list holds no
      credentials. An agent reaches a private tracker with its own access,
      for example an MCP connector.
  discoverability:
    question: "Where does the user find this?"
    answer: |
      The 'trackers:' list in .facetrc.yaml (FACET §5.4.5). Its effect is
      visible in the 'tickets' list that the MCP tool feature_get returns.
  common_pitfalls:
    question: "What do users commonly get wrong?"
    answer: |
      An unanchored pattern: '[A-Z]+-[0-9]+' without ^ and $ also matches
      inside a longer string. And order: the first matching pattern wins, so
      a broad pattern listed first captures keys meant for a later tracker.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      feature_get returns each ticket with a tracker and a link, and without
      by_default set where a pattern was meant to match.
lineage:
  owner:
    team: facet-framework
  created_at: "2026-10-09"
  depends_on:
    - navigation/interfaces/mcp-server
