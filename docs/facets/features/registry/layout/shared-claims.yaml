knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      That none of the four entries is a defect by itself. One purchase case
      can oblige both stock and invoicing; a shared helper legitimately
      carries several features' anchors. Each line names a place where two
      claims meet, and a person decides whether that is one feature built
      twice.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not a gate: it never fails a run, and a project that wants one case to
      belong to exactly one record needs a separate, explicit rule. Not a
      similarity search: two records describing one feature in different
      words and different steps stay invisible to it. Only Go sources are
      read for declarations: a declaration shared in another language is not
      named.
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Rewording a scenario so the identical-scenarios line goes away. The line
      asks whether two records describe one feature; changing the words
      answers nothing.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      'facet lint' prints the lines with an 'info:' marker and counts them per
      category in the summary; 'facet lint --json' carries 'shared_claims';
      the corpus carries them as 'sharedClaims' for a reader to show.
    derive_from:
      - anchors
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      Two records built for one feature both show the other one, and the
      summary line names how many entries each category holds.
