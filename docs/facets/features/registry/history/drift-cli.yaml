# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/history/drift-cli
lifecycle: active
intent:
  summary: |
    'facet drift --json' exposes the shared drift comparison as a CLI: which
    anchored source changed while its record stood still, and which records name
    renamed-away paths. Editors and CI can ask the same implementation as the
    Stop hook rather than maintaining a second file-level algorithm. One
    implementation keeps anchor parsing, prose exclusions and working-tree
    comparisons consistent across callers.
contract:
  scenarios:
    - id: json-output-lists-drifted-anchors
      statement: |
        Given anchored source that changed in the working tree while its record
        did not
        When 'facet drift --json' runs
        Then the drift array names the feature id, the changed path relative to
        the repository root, and when the file changed
      post_state:
        drift_count: 1
    - id: json-output-lists-stale-references
      statement: |
        Given a record's 'verification' names a path git has recorded as
        renamed
        When 'facet drift --json' runs
        Then staleReferences names the record, the old path it still mentions,
        and the path the rename moved it to
      post_state:
        stale_reference_count: 1
    - id: a-record-that-moved-with-its-code-is-not-drift
      statement: |
        Given anchored source changed and its own record changed alongside it
        When 'facet drift --json' runs
        Then the drift array is empty for that anchor, because a record that
        followed its code has already done the thing drift exists to prompt
      post_state:
        drift_count: 0
    - id: human-readable-output-names-file-and-record
      statement: |
        Given the same working tree, without '--json'
        When 'facet drift' runs
        Then each drifted anchor and each stale reference is printed as one
        line naming the feature and the path, followed by a summary count
    - id: the-check-runs-across-every-declared-registry
      statement: |
        Given a project that declares more than one registry in .facetrc.yaml
        When 'facet drift --json' runs with no '--registry' flag
        Then every declared registry is checked, and 'touched' is judged
        against every registry's record tree at once, because an anchor names
        an id and which registry holds the record for it does not change
        whether the anchored file moved without it
    - id: nothing-here-fails-a-build
      statement: |
        Given the working tree has drift or a stale reference
        When 'facet drift' runs, JSON or not
        Then the process still exits 0, because drift is a signal for a human
        or an editor to look at, not a defect a build should block on
      post_state:
        exit_code: 0
    - id: the-report-names-its-baseline
      statement: |
        Given any working tree
        When 'facet drift' runs
        Then the JSON carries a baseline with its ref, kind, commit, scope and
        status, and the text output says on its first line what was compared
        against — HEAD with "no review recorded", or an accepted review
    - id: an-explicit-baseline-that-does-not-resolve-fails
      statement: |
        Given '--baseline' naming a revision that does not exist
        When 'facet drift' runs
        Then it says drift could not be determined and exits non-zero, because
        a typo in a baseline is not a clean result
      post_state:
        exit_code: 1
    - id: json-output-lists-reference-changes
      statement: |
        Given an anchored file deleted, or an anchor removed from a file
        When 'facet drift --json' runs
        Then referenceChanges names each lost association, including records
        whose source file is gone (registry/history/reference-changes)
    - id: declared-source-repositories-have-their-own-baselines
      statement: |
        Given a registry whose sources name an ignored independent Git clone
        And the clone has an accepted review before an incoming commit
        When 'facet drift --json' runs from the workspace
        Then drift names the affected record and its workspace-relative source path
        And repositories names each compared repository and its own baseline
    - id: a-source-repository-can-use-its-own-explicit-revision
      statement: |
        Given a reviewed revision belonging to a declared source clone
        When 'facet drift --repository <clone> --baseline <revision> --json' runs
        Then the revision is resolved in that clone
        And the affected source path is reported relative to the workspace
verification:
  unit_tests:
    - id: cli/drift_test.go
      proves:
        - json-output-lists-drifted-anchors
        - json-output-lists-stale-references
        - a-record-that-moved-with-its-code-is-not-drift
        - human-readable-output-names-file-and-record
        - the-check-runs-across-every-declared-registry
        - nothing-here-fails-a-build
    - id: cli/reference_changes_test.go
      proves:
        - the-report-names-its-baseline
        - an-explicit-baseline-that-does-not-resolve-fails
        - json-output-lists-reference-changes
    - id: registry/drift_test.go
      proves:
        - json-output-lists-drifted-anchors
        - a-record-that-moved-with-its-code-is-not-drift
    - id: "cli/source_drift_test.go::TestSourceDriftCLIUsesCloneBaselineAndAcceptsWorkspacePath"
      proves:
        - declared-source-repositories-have-their-own-baselines
        - a-source-repository-can-use-its-own-explicit-revision
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      A git working tree and a project that has adopted FACET. Without an
      explicit baseline or repository selection, outside a Git repository
      the command still exits cleanly, and the report's baseline
      status says "no-repository" so an empty list is not read as no drift.

      The Stop hook and callers inside the binary use the same drift functions.
      External callers can shell out to 'facet drift --json', just as they can
      use 'facet lint --json', so they need not duplicate git-status parsing,
      anchor matching or prose-file exclusions.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not a semantic gate. Drift findings alone do not fail a run; 'facet lint'
      checks structural errors. An explicitly requested baseline or repository
      that cannot be compared still causes a nonzero exit.

      Not a substitute for the Stop hook's per-session dedup. Every call
      recomputes drift fresh against the working tree as it stands right now;
      nothing here remembers what it already told a session about.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      'facet drift' or 'facet drift --json' from a shell in the project.
      In legacy directory mode, use --repository with --baseline for a revision
      in a declared source clone; findings keep workspace-relative paths.
      With source_views, select --source-view and use the logical --repository
      identity; findings use repository:path and local bindings choose the
      checkout. An editor extension can shell out to it for a "flag anchored
      code that drifted from its record" quick fix, the same way it can shell
      out to 'facet lint --json'.
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Treating a non-empty drift list as a failed command. With a valid
      comparison, findings still return exit 0; a caller must choose whether
      to gate on them. Check baseline.status as well: an invalid explicit
      baseline or repository selection is an operational failure, not a
      semantic drift finding.

      Looking for a deleted anchored file under 'drift'. Drift is read from
      the changed file itself, so a deletion has nothing left to scan there;
      it is listed under 'referenceChanges' instead, read from the baseline
      and, for private anchors, from the clone's sidecar.

      Reading a clean result against HEAD as "the registry is up to date". It
      covers the uncommitted work only; the first line of the output says
      which baseline was used. With independent source clones, inspect every
      repositories entry; one accepted baseline does not establish a review
      for a different clone that still compares against HEAD.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      'facet drift --json' against a repository with an uncommitted, anchored
      edit prints a drift entry naming that file; against a clean tree it
      prints an empty report.
