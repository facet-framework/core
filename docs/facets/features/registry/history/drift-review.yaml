    - id: "cli/source_drift_test.go::TestADeclaredSubmoduleReachesDriftAcceptAndStop"
      proves:
        - a-declared-submodule-is-reviewed-in-its-own-repository
    - id: "registry/source_changes_test.go::TestAWorkspaceThatIsASubmoduleStillComparesItself"
      proves:
        - a-workspace-that-is-a-submodule-still-compares-itself
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      That a review is a statement about content at one moment. Accepting
      records exactly what the named files hold now; it says nothing about
      later edits, and nothing about files that were not named.

      The snapshot is the reviewed content and git compares it directly, so
      acknowledging a review needs no record edit or second file format.

      Once a review is recorded, editing a record no longer counts as reviewing
      its source; the touched-record heuristic stays only against HEAD, where
      nothing else exists.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not a semantic audit and not an approval. It records that somebody
      looked; whether the change preserved behaviour is still their judgement,
      and a source change remains a review signal rather than proof of a
      defect.

      Not shared review state. The snapshot belongs to one worktree of one
      clone; a team that wants a shared record of review uses its pull
      requests.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      The Stop hook's drift notice names 'facet drift accept'. 'facet drift'
      prints the current baseline on its first line. The catch-up skill reviews incoming commits after
      pull, merge, rebase or branch switch against the accepted baseline. Without
      one, it asks for the last reviewed revision instead of certifying HEAD.
      In legacy directory mode, --repository selects a declared source clone
      and acceptance paths stay workspace-relative. With a selected source
      view, --repository selects its logical repository ID and acceptance
      paths use repository:path; ignored local bindings locate the checkout.
      Source views select which repositories the drift covers.
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Expecting a record edit to clear drift after a review has been
      recorded. It no longer does; accept the change, or reset to HEAD to get
      the old heuristic back.

      Expecting another worktree or a teammate to see the acceptance. It is
      local by design, which is also what keeps a private registry from
      publishing review data. A plain acceptance without paths covers all
      changes in every selected source repository. A later repository failure
      leaves earlier successful acceptances in place; inspect the report again.
      When the review used an explicit older revision, pass it to accept with
      --baseline. A first partial acceptance otherwise starts at HEAD and
      cannot keep other incoming committed changes unreviewed.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      'facet drift' prints "Baseline: accepted review <commit>
      (behavior-unchanged, <date>)" and no longer lists the accepted change.
