# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/integrity/backing-gaps
lifecycle: active
intent:
  summary: |
    Checks scenarios declared unbacked and reports when their named unblocker
    has gone active, so shipped surfaces whose data is missing remain visible
    without being mistaken for defects. An unexplained gap is rejected because
    it is indistinguishable from an oversight. 'facet backing' lists each gap
    with its reason and unblocker.
contract:
  scenarios:
    - id: unexplained-unbacked-scenario-is-rejected
      statement: |
        Given a scenario declaring 'backing.state: unbacked' with no reason and
        no unblocked_by
        When 'facet lint' runs
        Then schema validation fails naming both missing fields, because an
        unexplained gap is indistinguishable from an oversight
      post_state:
        severity: error
    - id: declared-gap-is-not-itself-a-finding
      statement: |
        Given a scenario declaring itself unbacked with both a reason and an
        unblocked_by
        When 'facet lint' runs
        Then no finding is reported, because declaring the gap is the honest
        act the field exists for and warning about it would teach authors back
        into prose
      post_state:
        backing_findings: 0
    - id: unblocker-that-went-active-is-a-warning
      statement: |
        Given a scenario unbacked pending a feature id whose record is now
        active
        When 'facet lint' runs
        Then a warning reports that the data may exist now and the record was
        not told, and the run still succeeds
      post_state:
        exit_code: 0
    - id: prose-unblocker-is-not-resolved
      statement: |
        Given an unblocked_by naming a store or an issue rather than a
        canonical feature id
        When 'facet lint' runs
        Then it is not resolved against the registry and never reported as
        dangling, because faulting it would push authors into the vaguest
        phrasing that avoids the noise
      post_state:
        backing_findings: 0
    - id: backing-on-an-undeclared-variant-is-an-error
      statement: |
        Given a project with a variant map and a per-variant backing override
        naming a variant the map does not declare
        When 'facet lint' runs
        Then an error is reported, because nothing reads that key and the
        scenario would look backed on every variant
      post_state:
        severity: error
    - id: unbacked-scenarios-can-be-listed
      statement: |
        Given records declaring unbacked scenarios
        When 'facet backing' runs
        Then every one is listed with its reason and its unblocker, so the
        question the field exists to answer can be answered without reading
        the pull requests
      post_state:
        exit_code: 0
verification:
  unit_tests:
    - id: registry/backing_test.go
      proves:
        - unexplained-unbacked-scenario-is-rejected
        - declared-gap-is-not-itself-a-finding
        - unblocker-that-went-active-is-a-warning
        - prose-unblocker-is-not-resolved
        - backing-on-an-undeclared-variant-is-an-error
        - unbacked-scenarios-can-be-listed
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      Declaring a gap is not a defect and never warns. Leaving one undeclared is
      how a roadmap loses track of what is missing, and leaving a declared one
      after its unblocker went active is how it starts lying in the other
      direction.

      An unexplained gap is rejected outright: it is indistinguishable from an
      oversight, and the entire point of declaring it is that it is not one. So
      is a per-variant override naming a variant the variant map does not
      declare — nothing reads that key, and the scenario would read as backed on
      every variant instead of on none.

      'facet backing' lists every declared gap with its reason and its
      unblocker. That is the question the field exists to answer — what ships
      without data behind it, and what would close each one — so the declared
      gaps can be found without reconstructing them from pull requests.
  not_for:
    question: "When is this the wrong tool for the job?"
  discoverability:
    question: "Where does the user enter this flow in the product?"
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
  success_signal:
    question: "How does the user know it worked?"
