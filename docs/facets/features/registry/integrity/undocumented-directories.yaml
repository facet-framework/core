# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/integrity/undocumented-directories
lifecycle: active
intent:
  summary: |
    Reports sufficiently large directories with no anchors when repository-wide
    adoption crosses the check's threshold. A wholly unanchored directory has no
    documented neighbours, so the file-level hotspot rule becomes quiet
    precisely where this gap is largest. Repository adoption supplies that
    missing context; any anchor in the directory leaves the remaining work to
    the hotspot check.
contract:
  scenarios:
    - id: a-directory-with-no-anchor-at-all-is-reported
      statement: |
        Given a repository past the adoption gate and a directory of several
        hundred lines in which no file carries an anchor
        When lint runs
        Then that directory is named, with its line count, its file count and
        its largest file — "2,655 lines somewhere" is not something a reader
        can start on, and a file name is
    - id: one-anchor-takes-a-directory-out-of-this-check
      statement: |
        Given a directory that would otherwise be reported, plus one anchored
        file in it
        When lint runs
        Then it is not reported — somebody has started there, and what is left
        is the neighbourhood question `unanchored-hotspots` already asks
    - id: nothing-is-said-in-a-repository-that-has-not-adopted-facet
      statement: |
        Given a repository whose anchored share is below the gate
        When lint runs
        Then no directory is reported at all, because there is no practice for
        any of them to be inconsistent with
    - id: a-small-directory-is-not-an-undocumented-feature
      statement: |
        Given a directory of a few dozen lines with no anchor
        When lint runs
        Then it is not reported — the floor is the same idea as the file-level
        line floor, one level up
    - id: test-code-is-neither-candidate-nor-evidence
      statement: |
        Given a directory of test code, and tests elsewhere in the repository
        When lint runs
        Then that directory is not reported and those lines count towards
        neither share — a test is not a feature, and counting tests would make
        a well-tested project look like one that never adopted FACET
    - id: a-directory-that-opted-out-is-not-an-omission
      statement: |
        Given a directory whose files declared themselves out of the scan
        When lint runs
        Then it is not reported, because reporting it would make the
        declaration itself look like the thing that was forgotten
    - id: the-biggest-hole-comes-first
      statement: |
        Given several undocumented directories
        When they are reported
        Then the one with the most lines stands first, so a reader who acts on
        one line acts on the largest
    - id: a-file-type-this-project-never-anchors-is-not-counted
      statement: |
        Given a directory of files in a type nothing in this repository
        anchors anywhere
        When lint runs
        Then it is not reported — the project says for itself which kinds of
        file carry an anchor here, by having anchored some, and a type it has
        never anchored is data rather than undocumented code
verification:
  unit_tests:
    - id: registry/undocumented_test.go
      proves:
        - a-directory-with-no-anchor-at-all-is-reported
        - one-anchor-takes-a-directory-out-of-this-check
        - nothing-is-said-in-a-repository-that-has-not-adopted-facet
        - a-small-directory-is-not-an-undocumented-feature
        - test-code-is-neither-candidate-nor-evidence
        - a-directory-that-opted-out-is-not-an-omission
        - the-biggest-hole-comes-first
        - a-file-type-this-project-never-anchors-is-not-counted
knowledge:
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not a coverage figure. It does not say how well documented a directory
      is; it says that nobody has begun, which is a different and much
      cheaper question.

      Not `unanchored-hotspots`. That asks about one file among documented
      neighbours and answers it well. This asks about the neighbourhood
      itself, which is the case that one cannot see.

      Not an error. A directory may be undocumented on purpose, and the
      warning is a question rather than a verdict.
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Measuring anchored share with `grep -c '@facet:'`. A source file can
      mention the tag inside a string — a help text or error message that
      explains anchors, for example — and a substring match reads that as an
      anchor.
      The scan counts only what it recognises as one.

      Silencing this by anchoring one file in the directory. That is exactly
      what takes it out of this check, and it is the right move only if the
      anchor is true.

      Expecting it to see a language this project has never anchored. It
      cannot: the file types are learned from the anchors that exist. That is
      the same bargain unanchored-hotspots makes with its neighbourhood, and
      one anchor anywhere in that language opens the eye.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      Once repository adoption meets the threshold, sufficiently large wholly
      unanchored directories within the scan and adopted-file-type limits are
      named here. Smaller directories and excluded file types are outside this
      signal; the list gets shorter as eligible directories acquire anchors
      rather than as thresholds are moved.
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      It exists because the check beside it cannot see its own blind spot.
      `unanchored-hotspots` reports a file whose *neighbours* are documented,
      and that neighbourhood rule is what keeps it silent in a project that has
      not adopted FACET — a deliberate and good property, and the reason it can
      run unconditionally. The cost sits at the other end: a directory where
      nothing at all is anchored has no documented neighbours either, so the
      larger the hole, the quieter that check becomes.

      A wholly unanchored directory can stay invisible to the file-level
      neighbourhood rule even when most source lines elsewhere in the repository
      are anchored; repository-wide adoption supplies the context that directory
      lacks.

      The repository share takes the place of the neighbourhood. Below it, the
      project has no practice to be inconsistent with and this says nothing;
      above it, a directory with no anchor at all is a statement about that
      directory rather than about the project.

      Zero anchors and not "few" is the point. One anchor means somebody started
      there, and what remains is the other check's question. Zero means nobody
      did — and it is a threshold nobody has to tune.
