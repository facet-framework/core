# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/integrity/declared-deviations
lifecycle: active
intent:
  summary: |
    Holds and lists scenarios declared to describe unintended behaviour (FACET §3.2.2), distinguishing an observed defect from a product promise. Writing a
    defect as an ordinary contract cements the malfunction as specification,
    while omitting it makes the next reviewer rediscover it. Declaring a
    deviation is never itself a finding; a named replacement going active warns
    that the declaration may be stale.
contract:
  scenarios:
    - id: unexplained-deviation-is-rejected
      statement: |
        Given a scenario declaring a deviation with no reason
        When 'facet lint' runs
        Then schema validation fails naming the missing 'reason', because a
        defect claim nobody explained is indistinguishable from an author who
        mistrusted the feature
      post_state:
        severity: error
    - id: a-field-for-the-intended-behaviour-is-rejected
      statement: |
        Given a deviation carrying any additional field naming what the code
        ought to do instead
        When 'facet lint' runs
        Then schema validation fails, because a suspected intent recorded
        beside an observed one is indistinguishable from a contract — which is
        the failure the field exists to prevent
      post_state:
        severity: error
    - id: deviation-beside-an-unbacked-gap-is-rejected
      statement: |
        Given a scenario declaring both a deviation and a 'backing' whose state
        is unbacked, on the scenario or on one variant
        When 'facet lint' runs
        Then schema validation fails, because the two say the gap is intended
        and the behaviour is not, and a reader can then answer neither question
      post_state:
        severity: error
    - id: deviation-beside-a-backed-scenario-is-accepted
      statement: |
        Given a scenario declaring a deviation and 'backing.state: backed'
        When 'facet lint' runs
        Then it validates, because a defect usually has every row it needs and
        applies them wrongly — the schema rejects what cannot be true, never
        what is merely superfluous
      post_state:
        deviation_findings: 0
    - id: declared-deviation-is-not-itself-a-finding
      statement: |
        Given a scenario declaring a fully stated deviation
        When 'facet lint' runs
        Then no finding is reported, because writing the defect down is the
        honest act the field exists for and warning about it would teach
        authors back into stating it as a contract or omitting it
      post_state:
        deviation_findings: 0
    - id: tracker-that-went-active-is-a-warning
      statement: |
        Given a deviation whose 'tracked_as' names a feature id whose record is
        now active
        When 'facet lint' runs
        Then a warning reports that the fix may have shipped while the defect
        stayed documented, and the run still succeeds
      post_state:
        exit_code: 0
    - id: prose-tracker-is-not-resolved
      statement: |
        Given a 'tracked_as' naming a ticket or a thread rather than a
        canonical feature id, or written as an explicit null
        When 'facet lint' runs
        Then it is not resolved against the registry and never reported as
        dangling, because faulting it would push authors into the vaguest
        phrasing that avoids the noise
      post_state:
        deviation_findings: 0
    - id: declared-deviations-can-be-listed
      statement: |
        Given records declaring deviations
        When 'facet deviations' runs
        Then every one is listed with its reason, how it was confirmed and
        where it is tracked, while a scenario declaring nothing is left out
        And a field nobody recorded reads as unrecorded rather than as a blank
        And a claim carrying no reason is left out too — the schema rejects it,
        but the listing reads records without validating them, and the reason
        is the only part of an entry a reviewer can check
      post_state:
        exit_code: 0
verification:
  unit_tests:
    - id: registry/deviation_test.go
      proves:
        - unexplained-deviation-is-rejected
        - a-field-for-the-intended-behaviour-is-rejected
        - deviation-beside-an-unbacked-gap-is-rejected
        - deviation-beside-a-backed-scenario-is-accepted
        - declared-deviation-is-not-itself-a-finding
        - tracker-that-went-active-is-a-warning
        - prose-tracker-is-not-resolved
    - id: cli/deviations_test.go
      proves:
        - declared-deviations-can-be-listed
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      One distinction, and it is the whole feature: a scenario normally states
      what the product promises, and a scenario carrying a deviation states
      what the code does instead. Nothing else about FACET changes.

      The consequence is the part people have to hold on to: a deviation names
      only the observed behaviour. There is no place in it for the behaviour
      somebody thinks the code ought to have, and the schema rejects one.

      Declaring one is never a finding. What is checked is the single way the
      field can go stale on its own: a deviation whose 'tracked_as' names a
      record that has since gone active describes a defect whose replacement has
      shipped, and a defect documented after it was fixed is a lie in the other
      direction.

      Nothing here judges the wording. Whether a scenario's id names the
      behaviour observed rather than the behaviour expected is the obligation
      that matters most and the one no check can decide: deciding it requires
      knowing the intended behaviour, which the record deliberately does not
      state. A warning built on a guess would fire on correct ids, miss wrong
      ones, and make declaring a defect expensive — and the cheapest way to
      silence it would be to stop declaring defects.

      The refusal the schema does enforce is the contradiction: a deviation
      cannot sit beside an unbacked 'backing', because that says in one breath
      that the gap is intended and that the behaviour is not.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not for a bug that has been fixed. That is 'defects.fixes[]' (FACET §3.9) — a
      ledger of commits, appended by tooling. A deviation is present tense;
      when the defect is fixed the deviation is removed.

      Not for behaviour that is merely missing its data. A surface that ships
      its empty state deliberately is 'backing: unbacked' (FACET §3.2.1), and the two
      cannot be declared together.

      Not a tracker. One line of 'tracked_as' points at where a fix is decided;
      priority, assignee and history belong in the issue it names.

      Not a way to check wording. Nothing here can tell whether a scenario's id
      names the observed behaviour or the expected one, and it does not try.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      Write 'deviation' on a contract scenario; 'facet lint' validates it and
      'facet deviations' lists every one the registry declares.
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Naming the scenario after the behaviour they wish the code had. No check catches this contradiction: an id
      like 'delete-is-tenant-scoped' on a scenario declaring that deletes are
      not tenant-scoped contradicts itself, and the id is what a diff, a search
      and a summary show without opening the record.

      Smuggling the intended behaviour into 'reason'. The reason says why the
      observed behaviour is believed to be unintended — which predicate is
      built and never applied — not what should replace it.

      Reading an absent deviation as approval. It means nobody declared the
      behaviour to be a defect, exactly as an absent 'audience' means nobody
      classified the sentence.

      Leaving a deviation behind after the fix ships. The warning only fires
      when 'tracked_as' is a feature id; a deviation tracked by a ticket goes
      stale silently.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      'facet lint' stays green: writing the defect down never costs a finding.

      'facet deviations' prints the behaviour with its reason, so the question
      the field exists to answer — which documented behaviour is a defect
      rather than a promise — is answerable without reading the pull requests.

      When the fix lands and 'tracked_as' named a record, the next lint run
      says so instead of leaving the defect documented as live.
