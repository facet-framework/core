# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: registry/integrity/variant-coverage
lifecycle: active
intent:
  summary: |
    Decides whether a feature can be said to exist on a variant, by asking
    whether any code exclusive to that variant anchors it.

    Exclusivity is the whole test. Shared code proves nothing about which
    client a user can reach the feature from, so a record claiming 'active'
    on iOS while only the shared layer anchors it is claiming something
    nobody verified — and every coverage percentage computed from that claim
    inherits the error.

    The converse check keeps the variant map honest: an anchored file
    belonging to no declared variant and no shared path means the map has
    rotted behind the repository, and coverage silently under-reports with
    nothing turning red.
contract:
  scenarios:
    - id: shared-code-proves-no-variant
      statement: |
        Given a project declaring variants, and a feature active on a client
        whose only anchors lie in shared code
        When 'facet lint' runs
        Then a warning reports that shared logic existing does not establish
        that a user of that client can reach the feature
      post_state:
        severity: warning
    - id: exclusive-code-proves-presence
      statement: |
        Given an anchor in a path belonging to exactly one variant
        When 'facet lint' runs
        Then that variant's active lifecycle is satisfied
      post_state:
        findings: 0
    - id: unmapped-anchored-file-is-an-error
      statement: |
        Given a project declaring variants, and an anchored file matching no
        declared pattern
        When 'facet lint' runs
        Then it is reported as an error, so the variant map cannot rot while
        coverage silently under-reports
      post_state:
        severity: error
verification:
  unit_tests:
    - id: registry/variant_test.go
      proves:
        - shared-code-proves-no-variant
        - exclusive-code-proves-presence
        - unmapped-anchored-file-is-an-error
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
  not_for:
    question: "When is this the wrong tool for the job?"
  discoverability:
    question: "Where does the user enter this flow in the product?"
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
  success_signal:
    question: "How does the user know it worked?"
lineage:
  owner:
    team: facet-framework
  created_at: "2026-07-26"
  superseded_by: null
