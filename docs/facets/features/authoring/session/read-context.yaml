# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: authoring/session/read-context
lifecycle: active
intent:
  summary: |
    Provides existing feature claims before an agent changes anchored source.
    Limits repeated context within a session and restores it after a reset.
contract:
  scenarios:
    - id: claims-before-edit
      statement: |
        Given a source file with a primary or related anchor and an active record
        When the agent reads the file with Read
        Then it receives intent and scenario ids in the PostToolUse context before the edit
      post_state:
        additional_context_emitted: true
    - id: context-after-reset
      statement: |
        Given promises already delivered for a file and session
        When the same file is read again
        Then repeats stay out until PreCompact or SessionStart
        And another file with the same record receives its own context
      post_state:
        deduplicated_per_file: true
    - id: eligible-records-only
      statement: |
        Given records with different lifecycle values and anchor roles
        When the agent reads their source files
        Then only active or planned records with primary or related anchors are delivered
        And a Read of a record file does not trigger write validation
      post_state:
        record_write_validation: false
    - id: plugin-read-wiring
      statement: |
        Given the installed plugin and an available FACET binary
        When PostToolUse fires for Read
        Then the separate read script delivers the context through the binary
        And the PreToolUse read gate stays wired independently of it
      post_state:
        read_context_hook_wired: true
    - id: bounded-context
      statement: |
        Given a source file with many anchors and large records
        When the agent reads the file
        Then the decoded JSON context stays under 8192 bytes, Unicode included
        And it names omitted promises without replacement characters for truncated characters
        And Knowledge content is not copied as complete records
      post_state:
        context_bytes_max: 8192
    - id: unrelated-repository-is-not-claimed
      statement: |
        Given a source file read outside the FACET working tree
        And its anchor matches a record in the session's working directory
        When its own Git working copy has no registry
        Then the file receives no context from the foreign session registry
      post_state:
        additional_context_emitted: false
    - id: codex-patch-receives-existing-intent
      statement: |
        Given an existing source file with a primary anchor to an active record
        When Codex prepares a patch to that file
        Then the pre-edit context includes the record's current intent
      post_state:
        additional_context_emitted: true
verification:
  unit_tests:
    - id: cli/hook_readcontext_test.go
      proves:
        - claims-before-edit
        - context-after-reset
        - eligible-records-only
        - plugin-read-wiring
        - bounded-context
        - unrelated-repository-is-not-claimed
    - id: "cli/hook_codex_test.go::TestCodexPrePatchSuppliesExistingSourceClaims"
      proves:
        - codex-patch-receives-existing-intent
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
  not_for:
    question: "When is this the wrong tool for the job?"
  discoverability:
    question: "Where does the user enter this flow in the product?"
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
  success_signal:
    question: "How does the user know it worked?"
lineage:
  owner:
    team: facet-framework
  created_at: "2026-10-06"
  superseded_by: null
