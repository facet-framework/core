# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: delivery/distribution/cli-reference
lifecycle: active
intent:
  summary: |
    Prints the binary's own command tree — every visible command and flag
    with its help text, type and default — as JSON, so the published CLI
    reference is generated from the code instead of scraped from '--help'.
    A new flag reaches the documentation the next time it is generated, and
    a flag without help text fails the build before it can ship an empty row.
contract:
  scenarios:
    - id: every-visible-command-and-flag-is-described
      statement: |
        Given the facet binary
        When 'facet docs cli' runs
        Then it prints one JSON document with a schema version, the facet
        version and the root command
        And every visible command appears with its path, use, short, long,
        aliases, example and deprecation notice, and whether it runs by
        itself or only groups subcommands
        And every visible flag a command declares itself appears with its
        name, shorthand, type, default, usage and whether it is required
      post_state:
        exit_code: 0
    - id: hidden-and-cobra-owned-entries-stay-out
      statement: |
        Given a command tree with a hidden command, a hidden flag, and
        cobra's own help and completion commands and --help and --version
        flags
        When the reference is generated
        Then none of them appear
        And a command's own flag that happens to be named --version still
        appears
    - id: persistent-flags-appear-once
      statement: |
        Given a persistent flag declared on the root command, such as --root
        When the reference is generated
        Then it is listed once under persistent_flags
        And it is not repeated under any command's own flags
    - id: a-new-flag-appears-without-editing-a-list
      statement: |
        Given a command whose reference lists no flags
        When a flag is added to that command in code
        Then the next generated reference lists that flag with the type and
        default it was declared with
    - id: flags-read-as-help-prints-them
      statement: |
        Given a slice flag, and a flag whose usage names its value in back
        quotes
        When the reference is generated
        Then each flag's value_name is what --help prints after it ("strings",
        the back-quoted name)
        And its usage has the back quotes removed, as --help shows it
    - id: a-flag-without-help-text-fails-the-build
      statement: |
        Given a visible command without a short description, or a visible
        flag without usage text
        When the cli test suite runs
        Then it fails and names the command or flag
verification:
  unit_tests:
    - id: cli/clireference_test.go
      proves:
        - every-visible-command-and-flag-is-described
        - hidden-and-cobra-owned-entries-stay-out
        - persistent-flags-appear-once
        - a-new-flag-appears-without-editing-a-list
        - flags-read-as-help-prints-them
        - a-flag-without-help-text-fails-the-build
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      That it is a build input, not a user command: it is hidden from
      'facet --help', and its reader is a documentation generator that builds
      a CLI reference from it.
  not_for:
    question: "When is this the wrong tool for the job?"
    answer: |
      Not for reading help in a terminal — 'facet <command> --help' does that.
      Not a description of the hidden 'facet hook' command or the git filters,
      which are left out on purpose.
  discoverability:
    question: "Where does the user enter this flow in the product?"
    answer: |
      'facet docs cli', hidden from the command list.
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
    answer: |
      Expecting inherited flags under every command. The root's --root is
      listed once under persistent_flags, and each command lists only the
      flags it declares itself.
  success_signal:
    question: "How does the user know it worked?"
    answer: |
      'facet docs cli | jq .' exits 0, and a flag added in code appears in the
      output without any list being edited.
lineage:
  owner:
    team: facet-framework
  created_at: "2026-10-24"
  superseded_by: null
