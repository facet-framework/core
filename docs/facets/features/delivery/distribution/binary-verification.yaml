# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: delivery/distribution/binary-verification
lifecycle: active
intent:
  summary: |
    Refuses to run bytes it has not checked: the checksum comes from the
    release that served the archive, a mismatch stops everything, and nothing
    is executed or kept before the comparison. An install becomes visible only
    as a whole — staged, marked complete with install.json, then renamed into
    place — so an interrupted or parallel download never leaves something a
    later run would select. Version-free pointers track the install actually
    resolved, and a symlink that cannot be created costs the convenience, not
    the install.
contract:
  scenarios:
    - id: checksums-come-from-the-serving-release
      statement: |
        Given the archive was served by a fork
        When it is verified
        Then it is compared against that fork's checksums.txt, not upstream's
    - id: a-mismatch-stops-everything
      statement: |
        Given an archive whose checksum does not match its release's list
        When verification fails
        Then the dispatcher aborts and names the source, rather than trying the
        next one
      post_state:
        exit_code: 1
        binary_executed: false
    - id: every-published-archive-format-is-verified-alike
      statement: |
        Given a platform whose archive is a zip rather than a tarball
        When its checksum does not match its release's list
        Then it is rejected on the same terms, because the name looked up in
        checksums.txt is the name that was downloaded, and neither an install
        nor a staging directory is left behind
      post_state:
        exit_code: 1
        binary_executed: false
        cached: false
    - id: the-checksum-line-is-matched-by-exact-name
      statement: |
        Given a checksums.txt whose first line names a look-alike of the
        archive with a wrong hash
        When the archive is verified
        Then only the line whose name field equals the archive name counts
    - id: an-incomplete-install-never-blocks-its-version
      statement: |
        Given a version directory with install.json but no runnable binary
        When that version is downloaded again
        Then the leftover is moved aside and the verified install takes its
        place
      post_state:
        exit_code: 0
        binary_executed: true
    - id: cleanup-touches-only-its-own-staging
      statement: |
        Given a cache directory whose path contains a space, beside a sibling
        directory named like the part before the space
        When a run fails and its trap cleans up
        Then only that run's staging directory is removed and the sibling's
        files survive
    - id: a-broken-download-leaves-nothing-selectable
      statement: |
        Given a download that breaks off after writing part of the archive, or
        a run interrupted while it downloads
        When the run ends
        Then no install of that version exists and the staging directory is
        empty, so no later run can select what was half fetched
      post_state:
        exit_code: 1
        cached: false
    - id: parallel-installs-end-with-one
      statement: |
        Given two dispatchers fetching the same release at the same time
        When both finish
        Then both run it and exactly one complete install remains; the second
        rename, which lands inside the first install, is removed again, and
        nothing is left in staging
      post_state:
        exit_code: 0
    - id: an-install-records-where-it-came-from
      statement: |
        Given a verified release archive
        When it is installed
        Then install.json beside the binary names product, distribution,
        platform, version, the binary and archive checksums, the source
        repository and the release tag
    - id: a-version-free-path-tracks-the-resolved-build
      statement: |
        Given a consumer that cannot see PATH, such as an editor extension
        When any facet command resolves an install from the dispatcher's
        cache, whether newly acquired or already there
        Then dist/core/selected points through that source's `current` at
        that version, both relative, so a path recorded once keeps working
        after an update
      post_state:
        current_points_at: resolved_version
    - id: a-missing-symlink-costs-only-the-shortcut
      statement: |
        Given a filesystem or shell that cannot create a symlink
        When the pointer cannot be written
        Then the command still runs normally and every other resolution step is
        unaffected
      post_state:
        binary_executed: true
        exit_code: 0
verification:
  unit_tests:
    - id: "cli/dispatcher_test.go::TestTheDispatcherPointsSelectedAtTheCachedInstall"
      proves:
        - a-version-free-path-tracks-the-resolved-build
    - id: "cli/dispatcher_test.go::TestTheSelectedPointerFollowsANewerVersion"
      proves:
        - a-version-free-path-tracks-the-resolved-build
    - id: "cli/dispatcher_archive_test.go::TestTheChecksumLineIsMatchedByExactName"
      proves:
        - the-checksum-line-is-matched-by-exact-name
    - id: "cli/dispatcher_test.go::TestAnInstallWithoutABinaryDoesNotBlockItsVersion"
      proves:
        - an-incomplete-install-never-blocks-its-version
    - id: "cli/dispatcher_test.go::TestABaseWithASpaceLosesNothingOutsideStaging"
      proves:
        - cleanup-touches-only-its-own-staging
    - id: "cli/dispatcher_test.go::TestAFailedDownloadLeavesNothingSelectable"
      proves:
        - a-broken-download-leaves-nothing-selectable
    - id: "cli/dispatcher_test.go::TestAnInterruptedDownloadLeavesNoStaging"
      proves:
        - a-broken-download-leaves-nothing-selectable
    - id: "cli/dispatcher_test.go::TestTwoConcurrentDispatchersEndWithOneInstall"
      proves:
        - parallel-installs-end-with-one
    - id: "cli/dispatcher_archive_test.go::TestAMismatchedZipStopsEverything"
      proves:
        - every-published-archive-format-is-verified-alike
    - id: "cli/dispatcher_archive_test.go::TestTheLinuxArchiveIsStillATarball"
      proves:
        - an-install-records-where-it-came-from
        - a-version-free-path-tracks-the-resolved-build
