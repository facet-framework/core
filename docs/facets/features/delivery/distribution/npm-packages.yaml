# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: delivery/distribution/npm-packages
lifecycle: active
intent:
  summary: |
    Packs the Core release archives into nine npm packages and stages them
    through OIDC for approval on npmjs.com.
contract:
  scenarios:
    - id: packages-carry-the-release-bytes
      statement: |
        Given a dist directory with release-manifest.json and the archives it names
        When the npm packages are generated
        Then each platform package holds exactly the binary extracted from its archive, executable
        And its sha256 equals the manifest's binary_sha256, and no Go build runs
    - id: a-mismatched-archive-or-binary-aborts
      statement: |
        Given an archive whose bytes differ from the manifest's archive_sha256, or a binary that differs from binary_sha256
        When the npm packages are generated
        Then generation fails naming that file, and no output directory is written
    - id: every-version-is-the-release-version-exactly
      statement: |
        Given a manifest version such as 0.1.0-dev.20261114.2, 0.1.0-rc.1 or 0.1.0
        When the npm packages are generated
        Then every package has that version, without build metadata
        And facet-framework depends on @facet-tools/core and the launcher optionally on each platform package by that exact version, never a range
    - id: platform-packages-map-the-six-platforms
      statement: |
        Given a manifest with linux, darwin and windows on amd64 and arm64
        When the npm packages are generated
        Then they are named <launcher>-linux-x64, -linux-arm64, -darwin-x64, -darwin-arm64, -win32-x64 and -win32-arm64 with matching npm os and cpu
        And a manifest of product atlas yields @facet-tools/atlas and its platform packages in the same shape, without entry packages
        And a manifest missing a platform is refused unless --allow-partial is given for a local build
        And the scoped Core packages carry publishConfig access public, every Core package names the public Core repository, and Atlas packages carry neither
    - id: every-core-package-page-shows-how-to-start
      statement: |
        Given a Core release with version V
        When the npm packages are generated
        Then the READMEs of facet-framework, @facet-tools/core and each platform package start a project with npx facet-framework@V init
        And the @facet-tools/core README shows npm install --save-dev facet-framework@V
        And no README keeps a template marker or placeholder, and the packages of another product carry none of Core's usage text
    - id: the-plan-names-tag-and-order
      statement: |
        Given a release of channel dev, rc or stable
        When the packages are packed
        Then publish-plan.json names the dist-tag, access and each tarball with the integrity npm pack measured
        And orders the platform packages first, then the launcher, then facet-framework and facet-tools
        And says publishable false, with each reason in blocked_by, for an incomplete platform set, an undecided access, or a packaged NOTICE that refers to a file no package contains ("third-party notices not included", the files in notice_missing)
        And a NOTICE that refers to no other file adds no such reason
    - id: the-plan-tags-core-rc-4-as-latest
      statement: |
        Given the complete Core release 0.1.0-rc.4
        When the packages are packed
        Then the publish plan and its nine package entries specify latest
        And the pack log reports latest
    - id: tarballs-hold-only-the-whitelisted-files
      statement: |
        Given the packed tarballs
        When their contents are listed
        Then a platform package holds package.json, README.md, LICENSE and its binary
        And the launcher and entry packages hold package.json, README.md, LICENSE and their one JavaScript file, nothing else
        And every Core package holds NOTICE as well, and Atlas packages none
        And when the Core archives carry THIRD_PARTY.json and THIRD_PARTY_LICENSES/, every Core package holds exactly those files as well
    - id: no-private-marker-reaches-a-tarball
      statement: |
        Given generated packages about to be packed
        When a text file in them, including one under THIRD_PARTY_LICENSES/, names the owner of the private module path, .npmrc, _authToken or GH_TOKEN
        Then packing is refused, naming the file, before any tarball is written
        And the platform binaries, which are not text, are scanned for the owner instead: a binary naming it is still packed, and publish-plan.json says publishable false with blocked_by "binary names private source <owner>"
    - id: the-license-is-read-from-the-archive
      statement: |
        Given the LICENSE file, and for Core the NOTICE file, the release archives carry
        When the npm packages are generated
        Then every package carries that LICENSE and declares its SPDX id (Apache-2.0 or AGPL-3.0-only), and every Core package carries that NOTICE byte for byte
        And a text the generator does not recognise, archives with differing LICENSE or NOTICE files, or a Core archive without NOTICE stop generation, naming the archive
    - id: packages-carry-the-archive-third-party-notices
      statement: |
        Given Core archives that carry THIRD_PARTY.json and THIRD_PARTY_LICENSES/
        When the npm packages are generated and packed
        Then every Core package and its tarball hold THIRD_PARTY.json and the files under THIRD_PARTY_LICENSES/ byte for byte as the archive holds them, each listed in files
        And notice_missing is empty, so the plan carries no "third-party notices not included"
        And an archive whose corpus differs from the others, or that holds THIRD_PARTY.json without any file under THIRD_PARTY_LICENSES/, stops generation, naming the archive
    - id: the-release-packs-but-never-publishes
      statement: |
        Given Core release archives
        When release-npm-pack.sh prepares the npm tarballs and publish-plan.json
        Then it writes the tarballs and the plan next to the archives
        And it publishes nothing, needs no npm credentials or OIDC and invokes no npm publish command
    - id: public-publication-follows-the-approved-release
      statement: |
        Given the public Core npm.yml workflow
        When workflow_dispatch starts the workflow with the required tag input
        Then the single job uses the npm environment, refuses a ref other than refs/heads/main and validates the version tag before checkout
        And it checks the environment, downloads the release assets and verifies their SHA-256 checksums and release.yml attestations before packing and staging
        And the job can read contents and attestations and request an OIDC token for staging
    - id: npm-rejects-unverified-release-assets
      statement: |
        Given release assets for six platforms with a manifest matching the checked-out tag
        When the verification step of npm.yml checks the release and its archives
        Then it refuses a draft release, a mismatched archive checksum or a rejected attestation
        And a mismatched checksum stops verification before any attestation request
    - id: npm-environment-allows-only-main-without-reviewers
      statement: |
        Given the npm environment rules returned by the GitHub API
        When release-environment-check.sh npm checks the environment
        Then it requires an environment without required reviewers or administrator bypass
        And the only deployment policy must be the main branch
    - id: staging-resumes-after-an-already-staged-version
      statement: |
        Given a complete publish plan with an already staged version, an identical published tarball and a fresh package
        When release-npm-publish.sh processes packages in plan order
        Then it reports that the version was staged earlier and its tag was fixed at staging
        And it skips the identical published tarball
        And it stages the fresh tarball by local path with provenance and public access
        And a later staging error fails the run
    - id: staging-selects-the-dist-tag-from-the-version
      statement: |
        Given a publishable plan with a fresh package at version <version>
        When release-npm-publish.sh stages the tarball
        Then the npm stage publish command sets --tag <dist_tag>
      examples:
        - name: Candidates through base version 0.1.0 and stable versions
          columns:
            - version
            - dist_tag
          rows:
            -
              - "0.0.9-rc.1"
              - latest
            -
              - "0.1.0-rc.4"
              - latest
            -
              - "0.1.0"
              - latest
            -
              - "1.0.0"
              - latest
        - name: Candidates above base version 0.1.0
          rows:
            -
              - "0.1.1-rc.1"
              - next
            -
              - "0.2.0-beta.1"
              - next
            -
              - "1.0.0-rc.1"
              - next
    - id: staged-packages-await-npm-approval
      statement: |
        Given Core packages staged through OIDC
        When the owner approves the tarballs on npmjs.com using 2FA
        Then npm publishes those versions
verification:
  unit_tests:
    - id: scripts/public-core-workflows.test.sh
      proves:
        - public-publication-follows-the-approved-release
        - npm-rejects-unverified-release-assets
knowledge:
  prerequisite_knowledge:
    question: "What must a maintainer configure before staging?"
    answer: |
      The npm environment permits only the main branch and has no required reviewers.
      On npmjs.com, each of the nine packages uses a stage-only trusted publisher
      for the Core repository, workflow npm.yml and environment npm. Package
      access requires two-factor authentication and disallows tokens.
  not_for:
    question: "What input is required for an npm transfer?"
    answer: |
      npm.yml uses a published Core release with attested archives. Local
      packaging can generate tarballs for testing.
  discoverability:
    question: "Where does a maintainer start the transfer?"
    answer: |
      After verifying a published release, npm-dispatch in release.yml starts
      npm.yml on main when FACET_NPM_PUBLISH is true. To start or repeat the
      transfer manually, run gh workflow run npm.yml --ref main -f tag=<tag> in the Core
      repository or select Actions, npm, Run workflow, then main and the tag.
      To pack from existing archives locally, run
      sh scripts/release-npm-pack.sh [--allow-partial] <dist>.
  common_pitfalls:
    question: "What can block a transfer?"
    answer: |
      Each trusted publisher must point to npm.yml. An already published
      tarball with different integrity stops the job.
  success_signal:
    question: "How does a maintainer recognize success?"
    answer: |
      The workflow reports which packages await approval and which have
      already been published. The pending tarballs are available on npmjs.com
      for approval using 2FA.
lineage:
  owner:
    team: facet-framework
  created_at: "2026-11-14"
