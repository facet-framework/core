knowledge:
  prerequisite_knowledge:
    question: "What must a reader know first?"
    answer: "npx and the facet dispatcher choose a binary before it starts, so only the running binary can notice that it is not the version a project pinned. The pin is compared with the product version facet version prints, and the remedy depends on the install origin described in delivery/distribution/install-origin."
  not_for:
    question: "What does this not establish?"
    answer: "It does not install, select or update anything. A pin is one exact version, never a range, and there is no environment override that skips it. The placeholder commands a build registers for optional products that are not installed do not check the pin, because they replace the pre-run and do no work beyond saying the product is missing. The shell hook fallback does not read the pin, and facet lsp exits with the message instead of serving."
  discoverability:
    question: "Where is this available?"
    answer: "Declare requires.core in .facetrc.yaml. facet version --json reports project_pin; hooks and facet mcp tool results carry the notice."
  common_pitfalls:
    question: "What can be misread?"
    answer: "A development build such as 0.1.0-dev.… does not satisfy a 0.1.0 pin. Stop, SessionEnd and PreCompact hook responses have no context field and carry no notice, and tool-use hooks report it once per session, so a later silent response does not mean the pin is met. An absent project_pin means no pin was declared; a broken one carries an error."
  success_signal:
    question: "How can the result be recognized?"
    answer: "In a pinned project an ordinary command run by another Core version exits non-zero with the file, both versions, the origin and its remedy, while facet version, setup and the git filters still work."
