knowledge:
  prerequisite_knowledge:
    answer: |
      Install an authorized native product package before using its observations.
      The product owns the evidence semantics and its configuration section;
      Core owns command dispatch and transport limits.
  not_for:
    answer: |
      This interface does not sandbox native code or install products on demand.
      It does not turn an absent or failed product into an empty successful report.
  discoverability:
    answer: |
      Installed observers participate in facet drift and session hooks, and
      installed MCP tools appear in facet mcp under their product namespace.
      Package state is visible through facet plugin product list.
  common_pitfalls:
    answer: |
      Observation failure is printed on stderr, drift-report failure appears
      under product_errors. A configuration section of a product the build does
      not link is not validated by Core; its typos surface only once the product
      reads it.
  success_signal:
    answer: |
      Product notes accompany the surfaced warning, session observations reach
      the installed product, and a missing requested product is named instead of
      an invented empty result.
