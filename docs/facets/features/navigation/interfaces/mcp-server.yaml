# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: navigation/interfaces/mcp-server
lifecycle: active
intent:
  summary: |
    Provides registry discovery and feature lookup through MCP. Exposes records
    for reading and reports validation findings without changing feature records.
contract:
  scenarios:
    - id: the-reader-can-list-the-tools-the-server-advertises
      statement: |
        Given the server `facet mcp` serves
        When a program embedding FACET asks it for tools/list through an
        in-memory session
        Then it receives the names a client of the stdio server would receive,
        so a surface naming them cannot drift from the server
    - id: bare-id-returns-every-registrys-record
      statement: |
        Given an MCP client calling feature_get with an unqualified id that two
        registries document
        When the tool executes
        Then both records are returned, each naming its registry, rather than
        the first match or an error
      post_state:
        records_returned: 2
    - id: get-always-returns-a-list
      statement: |
        Given a project declaring no registries
        When feature_get retrieves a known id
        Then the response is still a list, of one record carrying no registry
        name, so a client handles one shape everywhere
      post_state:
        records_returned: 1
        registry_name: ""
    - id: an-id-nobody-owns-is-still-dangling
      statement: |
        Given an anchor whose id has no record in any declared registry
        When 'facet lint' runs
        Then it is reported as an error
      post_state:
        severity: error
    - id: undeclared-registry-prefix-is-an-error
      statement: |
        Given an '@facet: <registry>:<id>' tag naming a registry that is not
        declared
        When 'facet lint' runs
        Then it is reported once as an error, because such a tag is skipped by
        every registry and would otherwise disconnect the file silently
      post_state:
        severity: error
        occurrences: 1
    - id: unknown-id-is-an-error
      statement: |
        Given an MCP client calling feature_get with an id that has no record
        When the tool executes
        Then it returns a structured error naming feature_find, and never a
        fuzzy match against a similar id
      post_state:
        result: error
    - id: read-facet-returns-only-the-asked-sections
      statement: |
        Given a record too large to read whole
        When a client calls read_facet with section names
        Then only those sections are returned, and without names the section
        list with sizes
      post_state:
        text_limited_to_sections: true
    - id: no-write-tools-exposed
      statement: |
        Given the MCP server of a Core build is running
        When a client lists available tools
        Then no tool writes a record and none merges a proposal — the write
        tools that are offered reach the glossary, which writes definitions
        rather than a promise and lands on a branch a person merges
        And a build that links further products also serves the tools those
        products register
      post_state:
        record_write_tools: 0
    - id: installed-server-uses-the-agent-project
      statement: |
        Scenario Outline: Start the installed server in the intended project
          Given an installed FACET plugin with its required executable available
          And the agent session uses <host>
          When the MCP server starts
          Then its registry root is <project>

          Examples:
            | host                      | project                       |
            | Codex in a worktree       | the session worktree          |
            | Claude with a project root | the supplied project directory |
            | a direct launcher call    | the current working directory |
    - id: missing-project-prevents-server-start
      statement: |
        Given a supplied project directory that does not exist
        When the MCP server is launched
        Then the launcher exits unsuccessfully before starting the server
      post_state:
        server_started: false
    - id: cloud-launch-names-only-an-existing-build
      statement: |
        Given a Claude Code cloud session (CLAUDE_CODE_REMOTE=true) with no
        FACET_BINARY set and no executable facet at ~/.local/bin/facet yet
        When the MCP server is launched
        Then the launcher asks the dispatcher for an explicit development build
        And once an executable ~/.local/bin/facet exists, the launcher names that binary instead
    - id: native-codex-requires-installed-cli
      statement: |
        Given FACET is absent from the executable search path
        When the native Codex plugin starts its MCP server
        Then the server cannot start
        And another cached executable is not used instead
      post_state:
        server_started: false
    - id: feature-get-resolves-the-tickets-a-record-names
      statement: |
        Given a project whose .facetrc.yaml declares trackers with a pattern and a url
        And a record naming tickets on lineage and on a scenario
        When an agent calls feature_get for that record, with or without a facet filter
        Then every ticket comes back with the field that named it and its scenario
        And with its relation, the tracker its key resolves to and the link to it
verification:
  unit_tests:
    - id: cli/mcp_tools_test.go
      proves:
        - the-reader-can-list-the-tools-the-server-advertises
    - id: cli/mcp_rag_test.go
      proves:
        - no-write-tools-exposed
    - id: cli/hook_readgate_test.go
      proves:
        - read-facet-returns-only-the-asked-sections
    - id: cli/mcp_test.go
      proves:
        - bare-id-returns-every-registrys-record
        - get-always-returns-a-list
        - unknown-id-is-an-error
    - id: cli/mcp_tickets_test.go
      proves:
        - feature-get-resolves-the-tickets-a-record-names
    - id: registry/lint_registry_test.go
      proves:
        - an-id-nobody-owns-is-still-dangling
        - undeclared-registry-prefix-is-an-error
knowledge:
  prerequisite_knowledge:
    question: "What must the user already understand to use this feature?"
    answer: |
      Enable the FACET plugin in the agent host. Codex also requires the FACET
      CLI on the executable search path; its native MCP server uses the session
      working directory as the registry root.
  not_for:
    question: "When is this the wrong tool for the job?"
  discoverability:
    question: "Where does the user enter this flow in the product?"
    derive_from:
      - anchors
  common_pitfalls:
    question: "What mistakes do users typically make?"
  success_signal:
    question: "How does the user know it worked?"
lineage:
  owner:
    team: facet-framework
  created_at: "2026-07-26"
  superseded_by: null
