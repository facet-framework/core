# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: navigation/interfaces/claude-connector
lifecycle: active
intent:
  summary: "Lets authorized Claude users read published FACET records, sections, anchors and bounded code excerpts, with optional record search."
contract:
  scenarios:
    - id: authorized-read
      statement: |
        Given an authorized Claude user and an explicitly published corpus
        When the integration requests a record or selected section
        Then the service returns only published content with snapshot provenance
    - id: denied-access
      statement: |
        Given missing identity, entitlement or required read permission
        When protected content is requested
        Then no protected content is returned
    - id: build-without-viewer
      statement: |
        Given a build that carries no viewer page and an operator configuration enabling the UI
        When an MCP host initializes, lists tools or requests the viewer resource
        Then no resources capability and no tool viewer link are offered
        And resource requests are answered with a JSON-RPC Method not found error
verification:
  unit_tests:
    - id: internal/remote/integration_test.go
      proves:
        - build-without-viewer
lineage:
  owner:
    team: facet-framework
  created_at: "2026-10-29"
