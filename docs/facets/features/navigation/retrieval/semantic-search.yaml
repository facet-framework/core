# Generated from a FACET registry maintained outside this repository.
# Propose changes through an issue or pull request; they are carried over at the next release.
schema_version: "0.1"
id: navigation/retrieval/semantic-search
lifecycle: active
intent:
  summary: |
    Answers a question against the indexed registry by ranking chunks
    against the embedded query, and hands the result to whoever asked — a
    shell, an agent's tool call, or a program that embeds FACET.

    Id lookup already works and is not the problem: the question people
    actually have is 'where do we handle expired discount codes', which
    names no id at all.

    Two properties of the search are design commitments rather than
    incidental. It stays linear in the number of documents and adds nothing
    per document beyond the arithmetic itself — about 12 milliseconds for a
    hundred thousand chunks at 768 dimensions on four unloaded cores, though
    the figure is a measurement rather than a promise, because a search a
    reader waits for is one they stop using. And the ranking is identical
    whether the scan ran on one core or was sharded across several — a
    parallel search that returned a slightly different order than a serial
    one would be a bug nobody could reproduce.

    A query embedded by a different model than the index is refused rather
    than answered badly, because the failure is otherwise invisible — the
    numbers are all valid, the ranking is meaningless, and nothing about the
    output says so. A project with no index is told which command to run
    instead of being given nothing.
contract:
  scenarios:
    - id: search-ranks-by-cosine-similarity
      statement: |
        Given an index and a query vector
        When the store is searched for k neighbours
        Then exactly the k highest cosine similarities are returned, best
        first, and the ranking is identical whether the scan ran on one core or
        was sharded across several
    - id: a-growing-registry-does-not-get-disproportionately-slower
      statement: |
        Given a registry that has grown by a factor of ten
        When it is searched
        Then the search costs no more than roughly ten times what it cost at
        the smaller size — between four and twelve times, measured as a ratio
        between two searches in the same process so that a loaded machine
        moves both sides alike
      post_state:
        min_scaling_ratio: 4
        max_scaling_ratio: 12
    - id: a-search-costs-little-more-than-reading-the-vectors
      statement: |
        Given a registry indexed for search
        When it is searched
        Then the search costs at most 1.25 times a bare pass over the same
        vectors that does nothing but multiply and accumulate, so the ranking
        machinery around the arithmetic is a quarter of it at worst rather
        than a multiple of it
      post_state:
        max_overhead_ratio: 1.25
    - id: a-query-embedded-by-another-model-is-refused
      statement: |
        Given an index built by one embedding model
        When a query would be embedded by a different one
        Then the query is refused with the two models named and the command to
        rebuild, because vectors from two models are not comparable and the
        wrong answer would be ranked, plausible and silent
      post_state:
        answers_across_models: 0
    - id: a-project-without-an-index-is-told-what-to-run
      statement: |
        Given a reader searching a project that has never been indexed
        When the index is asked for
        Then the answer says there is none and carries the command that builds
        one, rather than an empty result that reads as "nothing matches"
      post_state:
        empty_results_masquerading_as_absence: 0
    - id: a-hundred-thousand-chunks-answer-in-tens-of-milliseconds
      statement: |
        Given an index of 100 000 chunks at 768 dimensions
        When it is queried on ordinary developer hardware
        Then the answer comes back in tens of milliseconds rather than
        hundreds — about 12 ms on four unloaded cores — so the reader is not
        kept waiting
      post_state:
        observed_ms_four_idle_cores: 12
observation:
  slos:
    - name: "2× the documents costs between 1.2× and 3× the query time"
      target: 100
      window: per release
      query: go test ./rag -run TestSearchScalesLinearlyAndAddsNoOverheadPerDocument
      query_source: go test
    - name: "the scan costs at most 1.25× a bare dot-product loop over the same vectors"
      target: 100
      window: per release
      query: go test ./rag -run TestSearchScalesLinearlyAndAddsNoOverheadPerDocument
      query_source: go test
    - name: a query over 100 000 chunks at 768 dimensions stays in tens of milliseconds
      target: 100
      window: per release
      query: "go test ./rag -bench Search -count 10 > new.txt && benchstat old.txt new.txt"
      query_source: "go benchmark, run on an unloaded machine"
verification:
  unit_tests:
    - id: rag/chunk_test.go
      proves:
        - a-query-embedded-by-another-model-is-refused
    - id: rag/store_test.go
      proves:
        - search-ranks-by-cosine-similarity
    - id: rag/bench_test.go
      proves:
        - a-growing-registry-does-not-get-disproportionately-slower
        - a-search-costs-little-more-than-reading-the-vectors
    - id: "rag/bench_test.go::BenchmarkSearch"
      proves:
        - a-hundred-thousand-chunks-answer-in-tens-of-milliseconds
    - id: cli/mcp_rag_test.go
      proves:
        - a-project-without-an-index-is-told-what-to-run
